[project]
name = "meeting-listener"
version = "0.1.0"
description = "Talk with Bob when you say his name. He takes notes and can explain what a voice agent can do."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[bidi,bidi-aec,bidi-io,bidi-pyaudio,web-fetch]>=1.60.0",
]

[project.scripts]
hello-world-voice = "hello_world_voice.__main__:main"
assistant = "assistant.__main__:main"

[tool.uv.build-backend]
module-name = ["hello_world_voice", "assistant"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
